#    username: root
#    password: mysql
  cloud:
    nacos:
      server-addr: 192.168.101.65:8848
      discovery:
        namespace: 50d3edac-429d-4661-b0ea-b50688e365d7
        group: xuecheng-plus-project
        username: nacos
        password: nacos
      config:
        namespace: 50d3edac-429d-4661-b0ea-b50688e365d7
        group: xuecheng-plus-project
        file-extension: yaml
        refresh-enabled: true
        shared-configs: # 共享配置
          - dataId: shared-log.yaml # 共享日志配置
          - dataId: shared-springdoc.yaml
          - dataId: freemark-config-dev.yaml

